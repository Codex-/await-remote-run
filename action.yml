name: Await Remote Run
description: Await a remote repository run to complete, returning a result.
author: Alex Miller
branding:
  icon: shield
  color: purple
inputs:
  token:
    description: GitHub Personal Access Token for making API requests.
    required: true
  repo:
    description: Repository of the action to dispatch.
    required: true
  owner:
    description: Owner of the given repository.
    required: true
  run_id:
    description: Run ID to await the completion of.
    required: true
  jobs:
    description: >-
      Newline separated names of jobs within the run to await, instead of the
      whole run. Names must match the job name GitHub reports, which includes
      matrix parameters.
  run_timeout_seconds:
    description: Time until giving up on the run.
    default: 300
  cancel_timeout_seconds:
    description: >-
      Time until requesting cancellation of the remote run, if set.
      Must be less than run_timeout_seconds.
  poll_interval_ms:
    description: Frequency to poll the run for a status.
    default: 5000
runs:
  using: node24
  main: dist/index.mjs
